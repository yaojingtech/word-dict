<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词表打印排版工具 v2.0</title>
    <link rel="stylesheet" href="controls.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60; /* 改为绿色系，更护眼 */
            --border-color: #bdc3c7;
            --bg-color: #f5f7fa;
            --table-font-size: 14px; /* 默认字号变量 */
        }

        body {
            font-family: "Segoe UI", "Microsoft Yahei", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #333;
        }

        /* --- 预览区域 --- */
        #preview-area {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* 每页 + 右侧导出按钮 */
        .page-export-wrap {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .export-page-btn {
            flex-shrink: 0;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--accent-color);
            background: #fff;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .export-page-btn:hover {
            background: #e8f5e9;
        }

        .page-side-controls {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .page-font-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #666;
        }

        .page-font-control button {
            width: 26px;
            height: 26px;
            padding: 0;
            font-size: 14px;
            line-height: 1;
            color: #555;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-font-control button:hover {
            background: #e5e5e5;
        }

        .page-font-control .page-font-value {
            min-width: 36px;
            text-align: center;
        }

        @media print {
            .page-export-wrap { display: block; }
            .export-page-btn { display: none !important; }
            .page-side-controls { display: none !important; }
        }

        /* --- 纸张样式 --- */
        .page {
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            padding: 10mm;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        .page.a4-portrait { width: 210mm; height: 297mm; }
        .page.a4-landscape { width: 297mm; height: 210mm; }

        /* 页面内容区：严格不超出，为页码留空 */
        .page-content {
            max-height: calc(100% - 12mm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 严格限制内容高度，确保不超出页面（每页约 10 行） */
        .page.a4-landscape .page-content { max-height: calc(210mm - 24mm); }
        .page.a4-portrait .page-content { max-height: calc(297mm - 24mm); }

        /* --- 表格样式 --- */
        .print-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--table-font-size);
            table-layout: auto; /* 单词/音标列随当前页最长内容收缩 */
        }

        .print-table th, .print-table td {
            border: 1px solid #e0e0e0;
            padding: 0.5em 0.6em;
            text-align: left;
            vertical-align: top;
            line-height: 1.45;
        }

        .print-table th {
            font-weight: 700;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
            color: #000;
            white-space: nowrap;
            font-size: 0.95em;
        }

        /* --- 列语义样式（非平均分配：单词/音标收紧，释义留足空间）--- */
        /* 复合列：单词+音标 上下排列，整格水平垂直居中 */
        .col-word-phonetic-combined {
            width: 1%;
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
        }

        .cell-word-phonetic-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25em;
            line-height: 1.4;
            margin: 0 auto;
        }

        .cell-word {
            font-weight: 700;
            color: #000;
            font-size: 1.25em;
            cursor: pointer;
            transition: color 0.15s;
        }

        .cell-word:hover { color: var(--accent-color); }

        .col-word.word-speak {
            cursor: pointer;
            transition: color 0.15s;
        }

        .col-word.word-speak:hover { color: var(--accent-color); }

        .cell-phonetic {
            font-family: "Lucida Sans Unicode", "Arial", sans-serif;
            color: #000;
            font-size: 0.9em;
            padding: 0.12em 0.4em;
            border-radius: 3px;
            border: 1px solid #d0d5de;
        }

        .col-word { font-weight: 700; white-space: nowrap; color: #000; font-size: 1.05em; width: 4em; max-width: 4em; }
        .col-phonetic { white-space: nowrap; font-family: "Lucida Sans Unicode", "Arial", sans-serif; color: #000; font-size: 0.95em; width: 5em; max-width: 5em; }

        .col-pos {
            white-space: nowrap;
            color: #000;
            font-size: 0.9em;
            width: 4em;
            max-width: 5em;
        }

        .col-pos .pos-tag {
            display: inline-block;
            padding: 0.15em 0.5em;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9em;
            border: 1px solid #ccc;
        }

        /* 复合列：释义（definition + 简明释义）保留足够空间 */
        .col-definition-combined {
            width: 55%;
            min-width: 8em;
        }

        .def-block, .brief-block {
            padding: 0.35em 0;
            border-bottom: 1px dashed #e8e8e8;
            word-wrap: break-word;
            text-align: justify;
            line-height: 1.5;
        }

        .def-block:last-child, .brief-block:last-child {
            border-bottom: none;
        }

        .def-block {
            color: #000;
            font-size: 0.98em;
        }

        .brief-block {
            color: #000;
            font-size: 0.92em;
            line-height: 1.45;
        }

        /* 仅当页面内容过高时由 JS 添加 .page-brief-clamped，再启用两行限制 */
        .page-brief-clamped .brief-block {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brief-block::before {
            content: "释义：";
            color: #000;
            font-size: 0.9em;
            margin-right: 0.25em;
        }

        /* 简明释义中的词性标识（无背景，便于黑白打印） */
        .brief-block .brief-pos {
            display: inline;
            color: #000;
            padding: 0.08em 0.35em;
            border-radius: 3px;
            border: 1px solid #c8cdd6;
            font-size: 0.9em;
            font-weight: 600;
            margin-right: 0.2em;
        }

        /* 精选短语勾选时：第一个短语紧跟释义同一行，纯边框无背景，小两号 */
        .phrase-append {
            display: inline;
            margin-left: 0.4em;
            padding: 0.12em 0.4em;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.75em;
            line-height: 1.4;
            color: #4a5568;
            vertical-align: baseline;
        }

        .def-block .phrase-append { color: #000; }
        .brief-block .phrase-append { color: #000; }

        /* 其他列：不抢释义空间 */
        .col-default {
            word-wrap: break-word;
            text-align: justify;
            color: #000;
            width: 15%;
            min-width: 0;
        }

        /* --- 页脚页码 --- */
        .page-footer {
            position: absolute;
            bottom: 5mm;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: #333;
            font-family: monospace;
        }

        /* --- 打印媒体查询 --- */
        @media print {
            body { background: white; -webkit-print-color-adjust: exact; }
            .controls { display: none; }
            #preview-area { padding: 0; gap: 0; }
            .page {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
                border: none;
                width: 100%;
                height: auto;
            }
            .page-content { max-height: none !important; overflow: visible !important; }
        }
    </style>
</head>
<body>

<div class="controls">
    <div class="control-group">
        <label>上传</label>
        <input type="file" id="fileInput" accept=".csv">
    </div>
    <div class="control-group control-group-sep" aria-hidden="true"></div>
    <div class="control-group">
        <label>纸张</label>
        <select id="layoutSelect">
            <option value="a4-portrait">A4 纵向</option>
            <option value="a4-landscape">A4 横向</option>
        </select>
    </div>
    <div class="control-group">
        <label>行数</label>
        <input type="number" id="pageSizeInput" value="10" min="5" max="50" title="默认10条">
    </div>
    <div class="control-group">
        <label>字号</label>
        <input type="number" id="fontSizeInput" value="14" min="8" max="24" step="0.1">
        <button type="button" id="adaptiveFontBtn" class="adaptive-btn" title="每页单独自适应字号">自适应</button>
    </div>
    <div class="control-group">
        <label>发音</label>
        <select id="accentSelect" title="点击单词时的发音口音">
            <option value="1">英音</option>
            <option value="2">美音</option>
        </select>
    </div>
    <div class="control-group control-group-sep" aria-hidden="true"></div>
    <div class="control-group control-group-flex">
        <label>显示列</label>
        <div class="column-toggles" id="columnToggles">
            <span class="column-placeholder">请先上传文件...</span>
        </div>
    </div>
    <div class="control-group control-group-sep" aria-hidden="true"></div>
    <div class="control-group">
        <button type="button" id="goToPageBtn" class="go-to-page-btn" title="输入页码后跳转到该页">跳转</button>
    </div>
    <button type="button" id="exportPdfBtn" class="go-to-page-btn" title="选择范围后打开浏览器打印，可另存为 PDF">PDF导出</button>
    <button class="print-btn" id="exportAllBtn">导出全部</button>
</div>

<div id="preview-area">
    <div class="page a4-portrait" style="display: flex; justify-content: center; align-items: center; color: #bbb;">
        <div style="text-align: center;">
            <h3 style="margin-bottom: 10px;">👋 欢迎使用</h3>
            <p>点击左上角“上传CSV文件”开始排版</p>
            <p style="font-size: 0.8em;">(您的文件列数减少后，程序会自动适配)</p>
        </div>
    </div>
</div>

<script src="dom-to-image.min.js"></script>
<script src="index.js"></script>
<script>
    // 状态管理
    let allData = [];
    let headers = [];
    let visibleColumns = []; 

    // DOM 元素
    const fileInput = document.getElementById('fileInput');
    const layoutSelect = document.getElementById('layoutSelect');
    const pageSizeInput = document.getElementById('pageSizeInput');
    const fontSizeInput = document.getElementById('fontSizeInput');
    const previewArea = document.getElementById('preview-area');
    const columnToggles = document.getElementById('columnToggles');
    const rootStyles = document.documentElement.style;

    // CSV 解析逻辑
    function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let insideQuote = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"') {
                if (insideQuote && nextChar === '"') {
                    currentCell += '"';
                    i++; 
                } else {
                    insideQuote = !insideQuote;
                }
            } else if (char === ',' && !insideQuote) {
                currentRow.push(currentCell.trim());
                currentCell = '';
            } else if ((char === '\n' || char === '\r') && !insideQuote) {
                if (currentCell || currentRow.length > 0) {
                    currentRow.push(currentCell.trim());
                    rows.push(currentRow);
                }
                currentRow = [];
                currentCell = '';
                if (char === '\r' && nextChar === '\n') i++; 
            } else {
                currentCell += char;
            }
        }
        if (currentCell || currentRow.length > 0) {
            currentRow.push(currentCell.trim());
            rows.push(currentRow);
        }
        return rows;
    }

    // 从 JSON 加载数据（用于默认加载 word(2800).json）
    function loadFromJson(json) {
        if (!json || !json.headers || !Array.isArray(json.data)) return false;
        headers = json.headers;
        allData = json.data.filter(r => r && r.length > 1);
        if (allData.length === 0) return false;
        visibleColumns = headers.map((_, i) => i);
        initColumnControls();
        requestAnimationFrame(() => { renderPages(); });
        return true;
    }

    // 默认加载 word(2800).json
    fetch('word(2800).json')
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(json => { if (loadFromJson(json)) { /* 加载成功 */ } })
        .catch(() => { /* 文件不存在或 CORS，保持默认空状态 */ });

    // 文件上传处理（异步渲染避免卡住）
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const text = event.target.result;
                const rows = parseCSV(text);
                if (rows.length === 0) return;

                headers = rows[0];
                allData = rows.slice(1).filter(r => r.length > 1);
                // 默认勾选所有列（含精选短语）
                visibleColumns = headers.map((_, i) => i);

                initColumnControls();
                requestAnimationFrame(() => { renderPages(); });
            } catch (err) {
                console.error(err);
                alert('解析文件出错：' + (err.message || err));
            }
        };
        reader.readAsText(file);
    });

    // 根据表头名识别列类型（用于样式与合并）
    function getColumnRole(headerText) {
        const h = (headerText || '').trim().toLowerCase();
        const hzh = (headerText || '').trim();
        if (h === 'word' || hzh === '单词' || h === 'word ') return 'word';
        if (h === 'phonetic' || h === 'pronunciation' || hzh.includes('音标') || hzh === '美音' || hzh === '英音') return 'phonetic';
        if (h === 'pos' || hzh.includes('词性') || h.includes('part of speech')) return 'pos';
        if (h === 'definition' || hzh === 'definition') return 'definition';
        if (hzh === '简明释义' || hzh.includes('简明释义')) return 'brief';
        return 'default';
    }

    function getColumnClass(role, isCombinedDef, isCombinedWordPhonetic) {
        if (isCombinedWordPhonetic) return 'col-word-phonetic-combined';
        if (isCombinedDef) return 'col-definition-combined';
        if (role === 'word') return 'col-word';
        if (role === 'phonetic') return 'col-phonetic';
        if (role === 'pos') return 'col-pos';
        return 'col-default';
    }

    // 找出 definition 与 简明释义 的列索引
    function getDefinitionBriefIndices() {
        let defIdx = -1, briefIdx = -1;
        headers.forEach((h, i) => {
            if (getColumnRole(h) === 'definition') defIdx = i;
            if (getColumnRole(h) === 'brief') briefIdx = i;
        });
        return { defIdx, briefIdx };
    }

    // 找出 word 与 phonetic 的列索引
    function getWordPhoneticIndices() {
        let wordIdx = -1, phoneticIdx = -1;
        headers.forEach((h, i) => {
            if (getColumnRole(h) === 'word') wordIdx = i;
            if (getColumnRole(h) === 'phonetic') phoneticIdx = i;
        });
        return { wordIdx, phoneticIdx };
    }

    // 初始化列显示开关（单词+音标 合并为一个，definition + 简明释义 合并为一个）
    function initColumnControls() {
        columnToggles.innerHTML = '';
        const { defIdx, briefIdx } = getDefinitionBriefIndices();
        const { wordIdx, phoneticIdx } = getWordPhoneticIndices();
        const hasDefBrief = defIdx >= 0 && briefIdx >= 0;
        const hasWordPhonetic = wordIdx >= 0 && phoneticIdx >= 0;
        const used = new Set();
        if (hasDefBrief) used.add(defIdx).add(briefIdx);
        if (hasWordPhonetic) used.add(wordIdx).add(phoneticIdx);

        headers.forEach((header, index) => {
            if (used.has(index)) return;

            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = visibleColumns.includes(index);

            checkbox.onchange = () => {
                if (checkbox.checked) {
                    if (!visibleColumns.includes(index)) visibleColumns.push(index);
                } else {
                    visibleColumns = visibleColumns.filter(i => i !== index);
                }
                visibleColumns.sort((a, b) => a - b);
                renderPages();
            };

            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(header || `列 ${index + 1}`));
            columnToggles.appendChild(label);
        });

        if (hasWordPhonetic) {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = true;
            checkbox.onchange = () => {
                if (checkbox.checked) {
                    if (!visibleColumns.includes(wordIdx)) visibleColumns.push(wordIdx);
                    if (!visibleColumns.includes(phoneticIdx)) visibleColumns.push(phoneticIdx);
                } else {
                    visibleColumns = visibleColumns.filter(i => i !== wordIdx && i !== phoneticIdx);
                }
                visibleColumns.sort((a, b) => a - b);
                renderPages();
            };
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode('单词+音标'));
            columnToggles.appendChild(label);
        }

        if (hasDefBrief) {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = true;
            checkbox.onchange = () => {
                if (checkbox.checked) {
                    if (!visibleColumns.includes(defIdx)) visibleColumns.push(defIdx);
                    if (!visibleColumns.includes(briefIdx)) visibleColumns.push(briefIdx);
                } else {
                    visibleColumns = visibleColumns.filter(i => i !== defIdx && i !== briefIdx);
                }
                visibleColumns.sort((a, b) => a - b);
                renderPages();
            };
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode('释义 (definition + 简明释义)'));
            columnToggles.appendChild(label);
        }
    }

    // 精选短语列索引（勾选时不单独成列，第一个短语并入释义）
    function getPhraseColIndex() {
        const idx = headers.findIndex(h => (h || '').trim() === '精选短语');
        return idx >= 0 && visibleColumns.includes(idx) ? idx : -1;
    }

    // 从「精选短语」单元格取第一个短语，拆成英文/中文
    function parseFirstPhrase(raw) {
        if (!raw || !String(raw).trim()) return { en: '', zh: '' };
        const first = String(raw).split(/\s*\|\s*/)[0].trim();
        const idx = first.search(/[：:]/);
        if (idx < 0) return { en: first, zh: '' };
        return { en: first.slice(0, idx).trim(), zh: first.slice(idx + 1).trim() };
    }

    // 构建“显示列”（合并 单词+音标、definition + 简明释义；精选短语勾选时不再单独一列）
    function buildDisplayColumns() {
        if (!headers || headers.length === 0) return visibleColumns.map((colIndex) => ({ type: 'single', index: colIndex, header: (headers && headers[colIndex]) || ('列' + (colIndex + 1)) }));
        const { defIdx, briefIdx } = getDefinitionBriefIndices();
        const { wordIdx, phoneticIdx } = getWordPhoneticIndices();
        const phraseIdx = getPhraseColIndex();
        const mergeDefBrief = defIdx >= 0 && briefIdx >= 0 && visibleColumns.includes(defIdx) && visibleColumns.includes(briefIdx);
        const mergeWordPhonetic = wordIdx >= 0 && phoneticIdx >= 0 && visibleColumns.includes(wordIdx) && visibleColumns.includes(phoneticIdx);
        const result = [];
        let mergedDefBrief = false, mergedWordPhonetic = false;

        visibleColumns.forEach(colIndex => {
            if ((headers[colIndex] || '').trim() === '精选短语') return;
            if (mergeWordPhonetic && colIndex === phoneticIdx && mergedWordPhonetic) return;
            if (mergeDefBrief && colIndex === briefIdx && mergedDefBrief) return;
            if (mergeWordPhonetic && colIndex === wordIdx) {
                result.push({ type: 'wordPhonetic', wordIdx, phoneticIdx, header: '单词/音标' });
                mergedWordPhonetic = true;
                return;
            }
            if (mergeWordPhonetic && colIndex === phoneticIdx) return;
            if (mergeDefBrief && colIndex === defIdx) {
                result.push({ type: 'combined', defIdx, briefIdx, phraseIdx, header: '释义' });
                mergedDefBrief = true;
                return;
            }
            if (mergeDefBrief && colIndex === briefIdx) return;
            result.push({ type: 'single', index: colIndex, header: headers[colIndex] });
        });
        return result;
    }

    // 转义 HTML
    function escapeHtml(text) {
        if (text == null) return '';
        const s = String(text);
        return s
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // 为简明释义中的词性标识包裹样式（pron. adj. n. 等），便于加背景
    // 词性后可能有空格（英文）也可能无空格（直接跟中文），故用 \s* 并保留原空白
    function wrapBriefPos(html) {
        if (!html) return html;
        const posList = 'pron|adj|adv|det|n|v|prep|conj|interj|aux|art|num|int|vi|vt|pl|abbr';
        const re = new RegExp('\\b(' + posList + '\\.)(\\s*)', 'g');
        return html.replace(re, function(_, posDot, space) {
            return '<span class="brief-pos">' + posDot + '</span>' + space;
        });
    }

    // 渲染页面核心逻辑
    function renderPages() {
        if (!allData || allData.length === 0) return;
        try {
        previewArea.innerHTML = '';
        const pageSize = Math.min(50, Math.max(5, parseInt(pageSizeInput.value, 10) || 10));
        const layoutClass = layoutSelect.value;
        const totalPages = Math.ceil(allData.length / pageSize);
        const displayColumns = buildDisplayColumns();

        rootStyles.setProperty('--table-font-size', (fontSizeInput.value || 14) + 'px');

        for (let i = 0; i < totalPages; i++) {
            const pageData = allData.slice(i * pageSize, (i + 1) * pageSize);
            const pageDiv = document.createElement('div');
            pageDiv.className = `page ${layoutClass}`;

            let tableHtml = '<div class="page-content"><table class="print-table"><thead><tr>';

            displayColumns.forEach(col => {
                const role = col.type === 'single' ? getColumnRole(col.header) : '';
                const cls = col.type === 'wordPhonetic' ? 'col-word-phonetic-combined' : col.type === 'combined' ? 'col-definition-combined' : getColumnClass(role, false, false);
                const headerText = col.type === 'wordPhonetic' ? '单词/音标' : col.type === 'combined' ? col.header : col.header;
                tableHtml += `<th class="${cls}">${escapeHtml(headerText)}</th>`;
            });
            tableHtml += '</tr></thead><tbody>';

            pageData.forEach(row => {
                tableHtml += '<tr>';
                displayColumns.forEach(col => {
                    if (col.type === 'wordPhonetic') {
                        const rawWord = (row[col.wordIdx] || '').trim();
                        const w = escapeHtml(rawWord);
                        const p = escapeHtml(row[col.phoneticIdx] || '').trim();
                        tableHtml += '<td class="col-word-phonetic-combined"><div class="cell-word-phonetic-wrap">';
                        if (w) tableHtml += `<div class="cell-word" data-word="${escapeHtml(rawWord)}" title="点击发音">${w}</div>`;
                        if (p) tableHtml += `<div class="cell-phonetic">${p}</div>`;
                        if (!w && !p) tableHtml += '<div class="cell-word">&nbsp;</div>';
                        tableHtml += '</div></td>';
                    } else if (col.type === 'combined') {
                        let def = escapeHtml(row[col.defIdx] || '').trim();
                        let brief = escapeHtml(row[col.briefIdx] || '').trim();
                        const phrase = col.phraseIdx >= 0 ? parseFirstPhrase(row[col.phraseIdx]) : null;
                        if (phrase && (phrase.en || phrase.zh)) {
                            if (phrase.en) def += '<span class="phrase-append">' + escapeHtml(phrase.en) + '</span>';
                            if (phrase.zh) brief += '<span class="phrase-append">' + escapeHtml(phrase.zh) + '</span>';
                        }
                        brief = wrapBriefPos(brief);
                        tableHtml += '<td class="col-definition-combined">';
                        if (def) tableHtml += `<div class="def-block">${def}</div>`;
                        if (brief) tableHtml += `<div class="brief-block">${brief}</div>`;
                        if (!def && !brief) tableHtml += '<div class="def-block">&nbsp;</div>';
                        tableHtml += '</td>';
                    } else {
                        const role = getColumnRole(col.header);
                        const cls = getColumnClass(role, false, false);
                        let content = escapeHtml(row[col.index] || '');
                        const rawVal = (row[col.index] || '').trim();
                        if (role === 'pos' && content && content.length < 12) {
                            content = '<span class="pos-tag">' + content + '</span>';
                        }
                        const wordSpeakClass = role === 'word' && rawVal ? ' word-speak' : '';
                        const dataWord = role === 'word' && rawVal ? ` data-word="${escapeHtml(rawVal)}" title="点击发音"` : '';
                        tableHtml += `<td class="${cls}${wordSpeakClass}"${dataWord}>${content}</td>`;
                    }
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table></div>';
            var unitNum = Math.ceil((i + 1) / 2);
            var subNum = (i % 2) + 1;
            var unitLabel = 'U' + unitNum + '-' + subNum;
            tableHtml += `<div class="page-footer">${unitLabel} &nbsp; - 第 ${i + 1} 页 / 共 ${totalPages} 页 -</div>`;

            pageDiv.innerHTML = tableHtml;

            var baseFontSize = parseFloat(fontSizeInput.value, 10) || 14;
            pageDiv.style.setProperty('--table-font-size', baseFontSize + 'px');
            pageDiv.setAttribute('data-font-size', baseFontSize);

            var wrap = document.createElement('div');
            wrap.className = 'page-export-wrap';
            wrap.appendChild(pageDiv);

            var sideControls = document.createElement('div');
            sideControls.className = 'page-side-controls';

            var exportBtn = document.createElement('button');
            exportBtn.className = 'export-page-btn';
            exportBtn.textContent = '导出';
            exportBtn.type = 'button';
            (function(pageEl, pageNum, total) {
                exportBtn.onclick = function() {
                    if (typeof domtoimage === 'undefined') {
                        alert('请稍候，导出库加载中…');
                        return;
                    }
                    exportBtn.disabled = true;
                    exportBtn.textContent = '导出中…';
                    domtoimage.toPng(pageEl, { scale: 5 })
                        .then(function(dataUrl) {
                            var link = document.createElement('a');
                            link.download = '单词表_第' + pageNum + '页_共' + total + '页.png';
                            link.href = dataUrl;
                            link.click();
                        })
                        .catch(function(err) { alert('导出失败：' + (err.message || err)); })
                        .finally(function() {
                            exportBtn.disabled = false;
                            exportBtn.textContent = '导出';
                        });
                };
            })(pageDiv, i + 1, totalPages);
            sideControls.appendChild(exportBtn);

            var fontControl = document.createElement('div');
            fontControl.className = 'page-font-control';
            fontControl.innerHTML = '<span style="font-size:11px;color:#888;">字号</span>';
            var btnSmaller = document.createElement('button');
            btnSmaller.type = 'button';
            btnSmaller.textContent = '－';
            btnSmaller.title = '缩小 0.1px';
            var fontValue = document.createElement('span');
            fontValue.className = 'page-font-value';
            fontValue.textContent = baseFontSize + 'px';
            var btnBigger = document.createElement('button');
            btnBigger.type = 'button';
            btnBigger.textContent = '＋';
            btnBigger.title = '放大 0.1px';
            fontControl.appendChild(btnSmaller);
            fontControl.appendChild(fontValue);
            fontControl.appendChild(btnBigger);

            (function(panel, valueSpan) {
                var step = 0.1, minPx = 8, maxPx = 24;
                function getCurrent() {
                    var v = parseFloat(panel.getAttribute('data-font-size'), 10);
                    return isNaN(v) ? baseFontSize : v;
                }
                function setSize(px) {
                    px = Math.max(minPx, Math.min(maxPx, Math.round(px * 10) / 10));
                    panel.style.setProperty('--table-font-size', px + 'px');
                    panel.setAttribute('data-font-size', px);
                    valueSpan.textContent = px + 'px';
                    requestAnimationFrame(function() { updatePageBriefClamp(panel); });
                }
                btnSmaller.onclick = function() { setSize(getCurrent() - step); };
                btnBigger.onclick = function() { setSize(getCurrent() + step); };
            })(pageDiv, fontValue);

            sideControls.appendChild(fontControl);
            wrap.appendChild(sideControls);
            previewArea.appendChild(wrap);

            // 页面级：仅当本页内容高度超过可用区域时才启用简明释义两行限制
            (function(el) {
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() { updatePageBriefClamp(el); });
                });
            })(pageDiv);
        }
        } catch (err) {
            console.error(err);
            previewArea.innerHTML = '<div class="page" style="color:#c00; padding:20px;">渲染出错：' + (err.message || err) + '</div>';
        }
    }

    /**
     * 按页判断：仅当本页内容高度超过可用区域时，才为该页添加 .page-brief-clamped（简明释义两行限制）。
     * 先去掉 clamp 再测量自然高度，再根据结果添加或移除 class；字号变化后需重新调用。
     */
    function updatePageBriefClamp(pageEl) {
        if (!pageEl || !pageEl.querySelector) return;
        var content = pageEl.querySelector('.page-content');
        if (!content) return;
        pageEl.classList.remove('page-brief-clamped');
        content.offsetHeight; // 强制 reflow，确保无 clamp 时的布局
        var maxH = parseFloat(getComputedStyle(content).maxHeight);
        if (!maxH || isNaN(maxH)) return;
        var needClamp = content.scrollHeight > maxH;
        if (needClamp) pageEl.classList.add('page-brief-clamped');
    }

    // 监听各类输入变化
    layoutSelect.addEventListener('change', renderPages);
    pageSizeInput.addEventListener('input', renderPages);
    fontSizeInput.addEventListener('input', renderPages);

    // 点击单词发音（有道公开 API：英音 type=1，美音 type=2）
    const accentSelect = document.getElementById('accentSelect');
    let currentAudio = null;

    previewArea.addEventListener('click', function(e) {
        const wordEl = e.target.closest('.cell-word, .col-word.word-speak');
        if (!wordEl) return;
        const word = wordEl.getAttribute('data-word') || (wordEl.textContent || '').trim();
        if (!word) return;

        const type = (accentSelect && accentSelect.value) || '1';
        const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=' + type;

        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        currentAudio = new Audio(url);
        currentAudio.play().catch(function() { /* 静默处理自动播放限制 */ });
    });

    // 跳转到第 x 页
    (function() {
        var btn = document.getElementById('goToPageBtn');
        if (!btn) return;
        btn.onclick = function() {
            var wraps = previewArea.querySelectorAll('.page-export-wrap');
            var total = wraps.length;
            if (total === 0) {
                alert('暂无页面，请先上传文件。');
                return;
            }
            var input = prompt('请输入页码（1-' + total + '）', '1');
            if (input === null) return;
            var page = parseInt(input.trim(), 10);
            if (isNaN(page) || page < 1 || page > total) {
                alert('请输入有效页码 1-' + total);
                return;
            }
            var target = wraps[page - 1];
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
    })();

    // 自适应字号：每页单独计算最大字号，使内容不溢出（释义不被固定为2行）
    (function() {
        var btn = document.getElementById('adaptiveFontBtn');
        if (!btn) return;
        btn.onclick = function() {
            var wraps = previewArea.querySelectorAll('.page-export-wrap');
            var pages = [];
            wraps.forEach(function(w) {
                var pg = w.querySelector('.page');
                var valSpan = w.querySelector('.page-font-value');
                if (pg && valSpan) pages.push({ el: pg, span: valSpan });
            });
            if (pages.length === 0) {
                alert('暂无页面，请先上传文件。');
                return;
            }
            btn.disabled = true;
            btn.textContent = '适应中…';
            var minPx = 8, maxPx = 24, step = 0.1;
            function adaptOne(idx) {
                if (idx >= pages.length) {
                    btn.disabled = false;
                    btn.textContent = '自适应';
                    return;
                }
                var p = pages[idx];
                var pageEl = p.el, valueSpan = p.span;
                var px = minPx, best = minPx;
                function setAndCheck(size) {
                    pageEl.style.setProperty('--table-font-size', size + 'px');
                    pageEl.setAttribute('data-font-size', size);
                    pageEl.offsetHeight;
                    updatePageBriefClamp(pageEl);
                    return pageEl.classList.contains('page-brief-clamped');
                }
                while (px <= maxPx) {
                    if (setAndCheck(px)) {
                        best = Math.max(minPx, Math.round((px - step) * 10) / 10);
                        setAndCheck(best);
                        break;
                    }
                    best = px;
                    px = Math.round((px + step) * 10) / 10;
                }
                valueSpan.textContent = best + 'px';
                requestAnimationFrame(function() { adaptOne(idx + 1); });
            }
            adaptOne(0);
        };
    })();

    // PDF 导出：选择范围后打开浏览器打印面板（可另存为 PDF）
    (function() {
        function parsePageRange(input, total) {
            var s = (input || '').trim().toLowerCase();
            if (s === '全部' || s === 'all' || s === '*') {
                var arr = [];
                for (var i = 1; i <= total; i++) arr.push(i);
                return arr;
            }
            var pages = [];
            var parts = s.split(/[,，、\s]+/);
            for (var j = 0; j < parts.length; j++) {
                var p = parts[j].trim();
                var dash = p.indexOf('-');
                if (dash >= 0) {
                    var start = parseInt(p.slice(0, dash), 10);
                    var end = parseInt(p.slice(dash + 1), 10);
                    if (!isNaN(start) && !isNaN(end)) {
                        for (var k = Math.max(1, start); k <= Math.min(total, end); k++) pages.push(k);
                    }
                } else {
                    var n = parseInt(p, 10);
                    if (!isNaN(n) && n >= 1 && n <= total) pages.push(n);
                }
            }
            return pages.filter(function(v, i, a) { return a.indexOf(v) === i; }).sort(function(a,b){return a-b;});
        }
        var btn = document.getElementById('exportPdfBtn');
        if (btn) {
            btn.onclick = function() {
                var wraps = previewArea.querySelectorAll('.page-export-wrap');
                var total = wraps.length;
                if (total === 0) {
                    alert('暂无页面，请先上传文件。');
                    return;
                }
                var input = prompt('导出为 PDF 的页面范围\n示例：1-5 或 1,3,5 或 全部\n当前共 ' + total + ' 页', '全部');
                if (input === null) return;
                var range = parsePageRange(input, total);
                if (range.length === 0) {
                    alert('未识别到有效页面范围，请重试。');
                    return;
                }
                var rangeSet = {};
                range.forEach(function(p) { rangeSet[p] = true; });
                var hidden = [];
                for (var i = 0; i < wraps.length; i++) {
                    if (!rangeSet[i + 1]) {
                        wraps[i].style.display = 'none';
                        hidden.push(wraps[i]);
                    }
                }
                window.onafterprint = function() {
                    hidden.forEach(function(el) { el.style.display = ''; });
                    window.onafterprint = null;
                };
                window.print();
            };
        }
    })();

    // 导出全部：支持页面范围选择，多页时用 fflate 打包 zip 下载
    (function() {
        function dataUrlToU8(dataUrl) {
            var base64 = dataUrl.split(',')[1];
            if (!base64) return new Uint8Array(0);
            var binary = atob(base64);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }
        function parsePageRange(input, total) {
            var s = (input || '').trim().toLowerCase();
            if (s === '全部' || s === 'all' || s === '*') {
                var arr = [];
                for (var i = 1; i <= total; i++) arr.push(i);
                return arr;
            }
            var pages = [];
            var parts = s.split(/[,，、\s]+/);
            for (var j = 0; j < parts.length; j++) {
                var p = parts[j].trim();
                var dash = p.indexOf('-');
                if (dash >= 0) {
                    var start = parseInt(p.slice(0, dash), 10);
                    var end = parseInt(p.slice(dash + 1), 10);
                    if (!isNaN(start) && !isNaN(end)) {
                        for (var k = Math.max(1, start); k <= Math.min(total, end); k++) pages.push(k);
                    }
                } else {
                    var n = parseInt(p, 10);
                    if (!isNaN(n) && n >= 1 && n <= total) pages.push(n);
                }
            }
            return pages.filter(function(v, i, a) { return a.indexOf(v) === i; }).sort(function(a,b){return a-b;});
        }

        var exportAllBtn = document.getElementById('exportAllBtn');
        if (exportAllBtn) {
            exportAllBtn.onclick = function() {
                if (typeof domtoimage === 'undefined') {
                    alert('请稍候，导出库加载中…');
                    return;
                }
                var pageWraps = previewArea.querySelectorAll('.page-export-wrap');
                var pages = [];
                pageWraps.forEach(function(w) {
                    var pg = w.querySelector('.page');
                    if (pg) pages.push(pg);
                });
                var total = pages.length;
                if (total === 0) {
                    alert('暂无页面可导出，请先上传文件。');
                    return;
                }
                var input = prompt('导出页面范围\n示例：1-5 或 1,3,5 或 全部\n当前共 ' + total + ' 页', '全部');
                if (input === null) return;
                var range = parsePageRange(input, total);
                if (range.length === 0) {
                    alert('未识别到有效页面范围，请重试。');
                    return;
                }

                exportAllBtn.disabled = true;
                exportAllBtn.textContent = '导出中…';

                var toCapture = range.map(function(p) { return pages[p - 1]; });
                Promise.all(toCapture.map(function(el) { return domtoimage.toPng(el, { scale: 3 }); }))
                    .then(function(dataUrls) {
                        if (range.length === 1) {
                            var link = document.createElement('a');
                            link.download = '单词表_第' + range[0] + '页_共' + total + '页.png';
                            link.href = dataUrls[0];
                            link.click();
                        } else {
                            if (typeof fflate === 'undefined') {
                                alert('压缩库未加载，将逐个下载。');
                                range.forEach(function(p, i) {
                                    var a = document.createElement('a');
                                    a.download = '单词表_第' + p + '页.png';
                                    a.href = dataUrls[i];
                                    a.click();
                                });
                            } else {
                                var files = {};
                                range.forEach(function(p, i) {
                                    var name = '单词表_第' + p + '页.png';
                                    files[name] = [dataUrlToU8(dataUrls[i]), { level: 6 }];
                                });
                                var zipBytes = fflate.zipSync(files, { level: 6 });
                                var blob = new Blob([zipBytes], { type: 'application/zip' });
                                var url = URL.createObjectURL(blob);
                                var a = document.createElement('a');
                                a.href = url;
                                a.download = '单词表_导出.zip';
                                a.click();
                                URL.revokeObjectURL(url);
                            }
                        }
                    })
                    .catch(function(err) { alert('导出失败：' + (err.message || err)); })
                    .finally(function() {
                        exportAllBtn.disabled = false;
                        exportAllBtn.textContent = '导出全部';
                    });
            };
        }
    })();

</script>
