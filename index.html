<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贝东2800高频词词典</title>
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="controls">
    <div class="control-group">
        <label>上传</label>
        <input type="file" id="fileInput" accept=".csv">
    </div>
    <div class="control-group control-group-sep" aria-hidden="true"></div>
    <div class="control-group">
        <label>纸张</label>
        <select id="layoutSelect">
            <option value="a4-portrait">A4 纵向</option>
            <option value="a4-landscape">A4 横向</option>
        </select>
    </div>
    <div class="control-group">
        <label>行数</label>
        <input type="number" id="pageSizeInput" value="10" min="5" max="50" title="默认10条">
    </div>
    <div class="control-group">
        <label>字号</label>
        <input type="number" id="fontSizeInput" value="14" min="8" max="24" step="0.1">
        <button type="button" id="adaptiveFontBtn" class="adaptive-btn" title="每页单独自适应字号">自适应</button>
    </div>
    <div class="control-group">
        <label>发音</label>
        <select id="accentSelect" title="点击单词时的发音口音">
            <option value="1">英音</option>
            <option value="2">美音</option>
        </select>
    </div>
    <div class="control-group control-group-sep" aria-hidden="true"></div>
    <div class="control-group control-group-flex">
        <label>显示列</label>
        <div class="column-toggles" id="columnToggles">
            <span class="column-placeholder">请先上传文件...</span>
        </div>
    </div>
    <div class="control-group control-group-sep" aria-hidden="true"></div>
    <div class="control-group">
        <button type="button" id="goToPageBtn" class="go-to-page-btn" title="输入页码后跳转到该页">跳转</button>
    </div>
    <button type="button" id="exportPdfBtn" class="go-to-page-btn" title="选择范围后打开浏览器打印，可另存为 PDF">PDF导出</button>
    <button class="print-btn" id="exportAllBtn">导出全部</button>
</div>

<div id="preview-area">
    <div class="page a4-portrait" style="display: flex; justify-content: center; align-items: center; color: #bbb;">
        <div style="text-align: center;">
            <h3 style="margin-bottom: 10px;">👋 欢迎使用</h3>
            <p>点击左上角“上传CSV文件”开始排版</p>
            <p style="font-size: 0.8em;">(您的文件列数减少后，程序会自动适配)</p>
        </div>
    </div>
</div>

<!-- 单词详情模态框 -->
<div id="wordModalOverlay" class="word-modal-overlay" aria-hidden="true">
    <div class="word-modal-backdrop" id="wordModalBackdrop"></div>
    <button type="button" id="wordModalPrev" class="word-modal-nav-btn" aria-label="上一个单词">&#8249;</button>
    <div id="wordModalBox" class="word-modal-box" role="dialog">
        <button type="button" class="word-modal-close" id="wordModalClose" aria-label="关闭">×</button>
        <div id="wordModalContent" class="word-modal-content"></div>
    </div>
    <button type="button" id="wordModalNext" class="word-modal-nav-btn" aria-label="下一个单词">&#8250;</button>
</div>

<script src="libs/dom-to-image.min.js"></script>
<script src="libs/index.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/columns.js"></script>
    <script src="js/ai_config.js"></script>
    <script src="js/modal.js"></script>
<script src="js/export.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
